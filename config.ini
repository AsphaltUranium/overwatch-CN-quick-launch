; ============================================================
; 守望先锋一键启动 - 可选配置（电脑比较卡的用这个）
; ============================================================
; 用法：把这个文件放到 exe 同目录（战网客户端根目录，和
; 守望先锋一键启动.exe 放在一起）即可生效。
; 用记事本打开，改数字后保存即可，无需任何界面。
; 不需要了就删掉本文件，恢复默认。
;
; 注意：本文件是 UTF-8 编码，注释随便写中文没关系。
; ============================================================

[Settings]

; 等待战网客户端启动的最长时间（秒）。
; 电脑卡、1 分钟内打不开客户端的，把这个调大。
WindowTimeoutSeconds=150

; 发送启动指令后，等待游戏进程出现的最长时间（秒）。
; 游戏启动慢的，把这个调大。
GameTimeoutSeconds=120

; 产品代码：国服守望先锋 = Pro（默认）；国际服 = Overwatch
ProductCode=Pro

; 是否用计划任务静默提权（默认 true）。改成 false 则完全不用
; 管理员权限，但游戏启动时可能弹 UAC
UseElevation=true
